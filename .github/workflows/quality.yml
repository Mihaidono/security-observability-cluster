name: Quality Checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Commitlint
        uses: ./.github/actions/commitlint

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Pre-commit
        uses: ./.github/actions/pre-commit

      - name: Check frontend TLS plans without cloud access
        run: |
          terraform -chdir=infrastructure/stages/platform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infrastructure/stages/platform test -no-color
