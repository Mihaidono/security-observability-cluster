name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-infrastructure.yml"
      - "infrastructure/stages/core/**"
      - "infrastructure/stages/platform/**"
      - "infrastructure/modules/control-plane/**"
      - "infrastructure/modules/platform-addons/**"
      - "infrastructure/modules/platform-postgresql/**"
  workflow_dispatch:

concurrency:
  group: deploy-infrastructure-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  CLUSTER_ADMIN_USER_ARNS_JSON: ${{ vars.CLUSTER_ADMIN_USER_ARNS_JSON }}
  CONTROL_PLANE_BACKEND_API_TOKEN: ${{ secrets.CONTROL_PLANE_BACKEND_API_TOKEN }}
  PLATFORM_POSTGRESQL_PASSWORD: ${{ secrets.PLATFORM_POSTGRESQL_PASSWORD }}
  TF_IN_AUTOMATION: "true"

jobs:
  core:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Write Core CI Tfvars
        working-directory: infrastructure/stages/core
        shell: bash
        run: |
          jq -cn \
            --arg assume_role "${AWS_ROLE_TO_ASSUME}" \
            --argjson user_arns "${CLUSTER_ADMIN_USER_ARNS_JSON:-[]}" \
            '
              if ($assume_role | length) == 0 then
                error("AWS_ROLE_TO_ASSUME must be a non-empty IAM role ARN")
              elif ($user_arns | type) != "array" then
                error("CLUSTER_ADMIN_USER_ARNS_JSON must be a JSON array of IAM principal ARNs")
              else
                {
                  cluster_admin_principal_arns:
                    ([$assume_role] + ($user_arns | map(select(type == "string") | gsub("^\\s+|\\s+$"; "") | select(length > 0))) | unique)
                }
              end
            ' > ci.auto.tfvars.json

      - name: Terraform Init Core
        working-directory: infrastructure/stages/core
        run: terraform init -reconfigure -backend-config=backend.hcl

      - name: Terraform Plan Core
        id: plan
        working-directory: infrastructure/stages/core
        shell: bash
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -no-color -out=core.tfplan
          exit_code=$?
          set -e

          if [[ "$exit_code" == "0" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$exit_code" == "2" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exit "$exit_code"

      - name: Terraform Apply Core
        if: steps.plan.outputs.changed == 'true'
        working-directory: infrastructure/stages/core
        run: terraform apply -input=false -no-color core.tfplan

  platform:
    needs: core
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Write Platform CI Tfvars
        working-directory: infrastructure/stages/platform
        shell: bash
        run: |
          jq -cn \
            --arg assume_role "${AWS_ROLE_TO_ASSUME}" \
            --argjson user_arns "${CLUSTER_ADMIN_USER_ARNS_JSON:-[]}" \
            --arg backend_api_token "${CONTROL_PLANE_BACKEND_API_TOKEN}" \
            --arg postgresql_password "${PLATFORM_POSTGRESQL_PASSWORD}" \
            '
              if ($assume_role | length) == 0 then
                error("AWS_ROLE_TO_ASSUME must be a non-empty IAM role ARN")
              elif ($user_arns | type) != "array" then
                error("CLUSTER_ADMIN_USER_ARNS_JSON must be a JSON array of IAM principal ARNs")
              elif ($backend_api_token | length) == 0 then
                error("CONTROL_PLANE_BACKEND_API_TOKEN GitHub secret must be set")
              elif ($postgresql_password | length) == 0 then
                error("PLATFORM_POSTGRESQL_PASSWORD GitHub secret must be set")
              else
                {
                  cluster_admin_principal_arns:
                    ([$assume_role] + ($user_arns | map(select(type == "string") | gsub("^\\s+|\\s+$"; "") | select(length > 0))) | unique),
                  control_plane_backend_api_token: $backend_api_token,
                  postgresql_password: $postgresql_password
                }
              end
            ' > ci.auto.tfvars.json

      - name: Terraform Init Platform
        working-directory: infrastructure/stages/platform
        run: terraform init -reconfigure -backend-config=backend.hcl

      - name: Terraform Plan Platform
        id: plan
        working-directory: infrastructure/stages/platform
        shell: bash
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -no-color -out=platform.tfplan
          exit_code=$?
          set -e

          if [[ "$exit_code" == "0" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$exit_code" == "2" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exit "$exit_code"

      - name: Terraform Apply Platform
        if: steps.plan.outputs.changed == 'true'
        working-directory: infrastructure/stages/platform
        run: terraform apply -input=false -no-color platform.tfplan
