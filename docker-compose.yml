services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: isolens
      POSTGRES_USER: isolens
      POSTGRES_PASSWORD: isolens-dev-password-change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-password-change-me
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-dev-password-change-me
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:5173/auth
      KC_PROXY_HEADERS: xforwarded
    command:
      - start-dev
      - --import-realm
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak-import:/opt/keycloak/data/import:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    user: "${BACKEND_UID:-1000}:${BACKEND_GID:-1000}"
    working_dir: /app/backend
    env_file:
      - backend/.env
    environment:
      HOME: /home/backend
      AWS_SDK_LOAD_CONFIG: ${AWS_SDK_LOAD_CONFIG:-true}
      AWS_CONFIG_FILE: /home/backend/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /home/backend/.aws/credentials
      ISOLENS_TERRAFORM_VARIABLE_SET: lab
      ISOLENS_DATABASE_URL: postgresql://isolens:isolens-dev-password-change-me@postgres:5432/isolens
      ISOLENS_PUBLIC_APP_URL: http://localhost:5173
      ISOLENS_OIDC_INTERNAL_BASE_URL: http://keycloak:8080/auth
      ISOLENS_OIDC_REALM: isolens
      ISOLENS_OIDC_CLIENT_ID: isolens-web
      ISOLENS_OIDC_CLIENT_SECRET: ""
      ISOLENS_SESSION_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./infrastructure:/app/infrastructure
      - ${HOME}/.aws:/home/backend/.aws
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  runner:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    user: "${BACKEND_UID:-1000}:${BACKEND_GID:-1000}"
    working_dir: /app/backend
    env_file:
      - backend/.env
    environment:
      HOME: /home/backend
      AWS_SDK_LOAD_CONFIG: ${AWS_SDK_LOAD_CONFIG:-true}
      AWS_CONFIG_FILE: /home/backend/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /home/backend/.aws/credentials
      ISOLENS_TERRAFORM_VARIABLE_SET: lab
      ISOLENS_DATABASE_URL: postgresql://isolens:isolens-dev-password-change-me@postgres:5432/isolens
      ISOLENS_PUBLIC_APP_URL: http://localhost:5173
      ISOLENS_OIDC_INTERNAL_BASE_URL: http://keycloak:8080/auth
      ISOLENS_OIDC_REALM: isolens
      ISOLENS_OIDC_CLIENT_ID: isolens-web
      ISOLENS_OIDC_CLIENT_SECRET: ""
      ISOLENS_SESSION_COOKIE_SECURE: "false"
      ISOLENS_WORKER_ID: compose-runner
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      backend:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - ./infrastructure:/app/infrastructure
      - ${HOME}/.aws:/home/backend/.aws
    command: python -m app.runner_main

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    working_dir: /app/frontend
    depends_on:
      - backend
      - keycloak
    environment:
      VITE_DEV_BACKEND_PROXY_TARGET: http://backend:8000
      VITE_DEV_KEYCLOAK_PROXY_TARGET: http://keycloak:8080
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  frontend_node_modules:
  postgres_data:
